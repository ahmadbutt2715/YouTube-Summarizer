[project]
name = "yt-summarizer"
version = "0.1.0"
description = "Django frontend for a LangChain-powered YouTube video summarizer & Q&A agent"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "dotenv>=0.9.9",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.3.2",
    "langchain-text-splitters>=1.1.2",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.7.4",
]

[tool.uv]
package = false
